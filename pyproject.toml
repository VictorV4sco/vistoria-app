[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vistoria-app"
version = "0.1.0"
description = "Aplicação desktop para padronização e geração de relatórios de vistoria de imóveis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "python-docx>=1.1,<2",
    "docxtpl>=0.20,<1",
    "Pillow>=11,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-qt>=4.4,<5",
    "ruff>=0.11,<1",
]

[project.scripts]
vistoria-app = "app.main:main"

[tool.setuptools]
packages = ["app", "app.ui", "app.models", "app.services", "app.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
